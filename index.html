return`<div class="grid g4">${kpi('ขึ้นทะเบียนแล้ว',r.length+' ทีม','เป้าหมาย '+g+' ทีม · '+pct(r.length,g)+'%','var(--ok)')}${kpi('PCU',cnt(t=>t.type=='PCU'),'หน่วยบริการปฐมภูมิ')}${kpi('NPCU',cnt(t=>t.type=='NPCU'),'เครือข่ายหน่วยบริการปฐมภูมิ','var(--vi)')}${kpi('ยังไม่ขึ้นทะเบียน',g-r.length+' ทีม','ต้องดำเนินการต่อ','var(--wn)')}</div>
<div class="grid g2" style="margin-top:12px"><div class="card"><h3>แยกตามสังกัด (ทีมที่ขึ้นทะเบียนแล้ว)</h3><table><tr><th>สังกัด</th><th>PCU</th><th>NPCU</th><th>รวม</th></tr>${groups.map(a=>{const p=cnt(t=>aff(t)==a&&t.type=='PCU'),n=cnt(t=>aff(t)==a&&t.type=='NPCU');return p+n?`<tr><td>${a=='สธ'?'สธ.':a=='อบจ'?'อบจ. (รพ.สต.)':a=='อปท'?'อปท.':'กระทรวงยุติธรรม'}</td><td>${p}</td><td>${n}</td><td><b>${p+n}</b></td></tr>`:''}).join('')}</table><p class="note">จำแนกตามสังกัดหน่วยแรกของทีม และชนิด NPCU จากข้อมูลทะเบียนรายหน่วย</p></div>
<div class="card"><h3>จำนวนทีมที่ขึ้นทะเบียนรายปี (พ.ศ.)</h3><div class="tl">${ks.map(k=>`<div><b>${yrs[k]}</b><i style="height:${yrs[k]*100/mx}px"></i>${k}</div>`).join('')}</div></div></div>
<div class="card" style="margin-top:12px"><h3>รายอำเภอ : ขึ้นทะเบียน / เป้าหมาย</h3>${distRows(d=>[d.est,d.target],(d,v,m)=>v+'/'+m,'var(--ok)')}</div>
<div class="card" style="margin-top:12px"><h3>รายชื่อทีมที่ขึ้นทะเบียนแล้ว (${r.length})</h3><div class="tw"><table><tr><th>อำเภอ</th><th>ทีม</th><th>หน่วยบริการ</th><th>สังกัด</th><th>ประเภท</th><th>ปีที่ขึ้นทะเบียน</th><th>ประชากร</th></tr>${r.map(t=>`<tr><td>${t.d}</td><td>${t.no}</td><td>${t.units.map(u=>u.n).join('<br>')}</td><td>${aff(t)}</td><td><span class="b ${t.type=='PCU'?'in':'vi'}">${t.type}</span></td><td>${t.reg}</td><td>${fmt(t.pop)}</td></tr>`).join('')}</table></div></div>`},

fm(){const ts=ft(T),D=S.d=='all'?DATA:DATA.filter(d=>d.n==S.d);const need=D.reduce((a,d)=>a+d.need,0),has=ts.filter(t=>t.fm).length;
return`<div class="grid g4">${kpi('ต้องการแพทย์ FM เพิ่ม',need+' ท่าน','ตามหมายเหตุรายอำเภอ','var(--wn)')}${kpi('ทีมที่มีแพทย์ FM แล้ว',has+' ทีม','จาก '+ts.length+' ทีม ('+pct(has,ts.length)+'%)','var(--ok)')}${kpi('ทีมที่ยังไม่มีแพทย์ FM',ts.length-has+' ทีม','','var(--no)')}${S.d=='all'?kpi('แผนส่งอบรม Basic Course online ปี 2570','37 ท่าน','ต้องใช้รวมให้ครบ 100%: 42 ท่าน','var(--in)'):''}</div>
<div class="grid g2" style="margin-top:12px"><div class="card"><h3>ความต้องการแพทย์ FM เพิ่มรายอำเภอ</h3>${distRows(d=>[d.need,Math.max(...DATA.map(x=>x.need))],(d,v)=>v+' ท่าน','var(--wn)')}</div>
<div class="card"><h3>ทีมที่มีแพทย์ FM / ทีมทั้งหมด</h3>${distRows(d=>[d.teams.filter(t=>t.fm).length,d.teams.length],(d,v,m)=>v+'/'+m,'var(--ok)')}</div></div>
<div class="card" style="margin-top:12px"><h3>รายละเอียดรายอำเภอ</h3><div class="tw"><table><tr><th>อำเภอ</th><th>เป้าหมาย (ทีม)</th><th>ทีมมีแพทย์ FM</th><th>ต้องการเพิ่ม</th><th>หมายเหตุ</th></tr>${D.map(d=>`<tr><td>${d.n}</td><td>${d.target}</td><td>${d.teams.filter(t=>t.fm).length}</td><td><b>${d.need}</b></td><td>${(d.note.match(/\(.*\)\s*$/)||[''])[0]}</td></tr>`).join('')}</table></div></div>
<div class="card" style="margin-top:12px"><h3>สถานะแพทย์ FM รายทีม/เครือข่าย</h3><div class="tw"><table><tr><th>อำเภอ</th><th>ทีม</th><th>หน่วยบริการ</th><th>แพทย์ FM</th><th>ขึ้นทะเบียน</th></tr>${ts.map(t=>`<tr><td>${t.d}</td><td>${t.no}</td><td>${t.units.map(u=>u.n).join(', ')}</td><td>${t.fm?'<span class="b ok">มี</span>':'<span class="b no">ไม่มี</span>'}</td><td>${t.reg?'พ.ศ. '+t.reg:'<span class="b mu">ยังไม่ขึ้น</span>'}</td></tr>`).join('')}</table></div></div>`},

qa(){const us=ft(U).filter(u=>!u.pend&&(S.st=='all'||qs(u)==S.st)&&(S.q==''||(u.n+u.d).includes(S.q))),all=ft(U).filter(u=>!u.pend);
const c=k=>all.filter(u=>qs(u)==k).length;const fy=y=>all.filter(u=>qs(u)=='ok'&&u.a.fy==y).length;
return`<div class="grid g4">${kpi('ผ่านการประเมิน',c('ok')+' แห่ง','ปี 2568: '+fy(2568)+' · ปี 2569: '+fy(2569),'var(--ok)')}${kpi('ไม่ผ่าน',c('no')+' แห่ง','','var(--no)')}${kpi('ไม่อยู่ในรายชื่อประเมิน',c('na')+' แห่ง','รอจัดตั้ง/ไม่ปรากฏในไฟล์ ค.ป.ค.ม.','var(--wn)')}${kpi('ร้อยละผ่าน (จากที่ประเมิน)',pct(c('ok'),c('ok')+c('no'))+'%','','var(--in)')}</div>
<div class="card" style="margin-top:12px"><h3>ผลการตรวจประเมินรายอำเภอ</h3>${DATA.map(d=>{const s=dsum(d);return`<div class="row" onclick="pick('${d.n}')"><span>${d.n=='เมืองกาญจนบุรี'?'เมืองฯ':d.n}</span>${bar([[pct(s.ok,s.n),'var(--ok)'],[pct(s.no,s.n),'var(--no)'],[pct(s.na,s.n),'var(--bd)']])}<b>${s.ok}/${s.n}</b></div>`}).join('')}<div class="lg"><span><i style="background:var(--ok)"></i>ผ่าน</span><span><i style="background:var(--no)"></i>ไม่ผ่าน</span><span><i style="background:var(--bd)"></i>ไม่อยู่ในรายชื่อ</span></div></div>
<div class="card" style="margin-top:12px"><h3>สถานะรายหน่วยบริการ (${us.length})</h3><div class="bar"><input id="q" placeholder="ค้นหาชื่อหน่วยบริการ…" value="${S.q}" oninput="S.q=this.value;sk()"><select onchange="S.st=this.value;render()"><option value="all">ทุกสถานะ</option><option value="ok" ${S.st=='ok'?'selected':''}>ผ่าน</option><option value="no" ${S.st=='no'?'selected':''}>ไม่ผ่าน</option><option value="na" ${S.st=='na'?'selected':''}>ไม่อยู่ในรายชื่อ</option></select></div>
<div class="tw" style="max-height:560px"><table><tr><th>อำเภอ</th><th>ทีม</th><th>หน่วยบริการ</th><th>สังกัด</th><th>ผลประเมิน</th><th>วันที่ผ่าน</th></tr>${us.map(u=>`<tr><td>${u.d}</td><td>${u.t.no}</td><td>${u.n}</td><td>${u.aff}</td><td>${badge(u)}</td><td>${dt(u.a)||'–'}</td></tr>`).join('')}</table></div><p class="note">* วันที่ในไฟล์ต้นฉบับพิมพ์เป็น พ.ศ. 2669 ปรับเป็น 2569 โดยสันนิษฐาน (1 แห่ง) · รพ.บ่อพลอย ผ่านประเมิน ก.พ. 2569 (เพิ่มตามผู้ใช้แจ้ง) · ไม่ผ่าน = ศูนย์บริการสาธารณสุข เทศบาลตำบลท่ามะขาม (ปี 2569)</p></div>`},

net(){const D=S.d=='all'?DATA:DATA.filter(d=>d.n==S.d);
return`<div class="bar"><input id="q" placeholder="ค้นหาหน่วยบริการ…" value="${S.q}" oninput="S.q=this.value;sk()"><span class="note">เลือกอำเภอจากเมนูด้านบน เพื่อดูเครือข่ายและหน่วยบริการรายอำเภอ</span></div>
${D.map(d=>{const ts=d.teams.filter(t=>S.q==''||t.units.some(u=>u.n.includes(S.q)));if(!ts.length)return'';return`<h3 style="margin:16px 0 8px">อำเภอ${d.n} <span class="b ok">${d.est}/${d.target} ทีม</span> <span class="b wn">ต้องการแพทย์ FM +${d.need}</span></h3><div class="grid g2">${ts.map(t=>`<div class="card team ${t.reg?'r':''}"><h4>เครือข่ายที่ ${t.no} ${t.reg?`<span class="b ${t.type=='PCU'?'in':'vi'}">${t.type} · ${t.reg}</span>`:'<span class="b mu">ยังไม่ขึ้นทะเบียน</span>'} ${t.fm?'<span class="b ok">แพทย์ FM</span>':'<span class="b no">ไม่มีแพทย์ FM</span>'}</h4><div class="note">ประชากรรวม ${fmt(t.pop)} คน</div>${t.units.map(u=>`<div class="u"><span>${u.n}${u.pend?' <span class="b wn">รอจัดตั้ง</span>':''}${u.dq?' <span class="b mu" title="รายชื่อซ้ำกับ อ.บ่อพลอย ในเอกสาร">ตรวจสอบ</span>':''} <span class="note">${u.aff}${u.pop?' · '+fmt(u.pop):''}</span></span><span style="text-align:right">${badge(u)}<div class="note">${dt(u.a)}</div></span></div>`).join('')}</div>`).join('')}</div>${(d.extra||[]).length&&S.q==''?`<div class="card" style="margin-top:12px"><h4 style="margin:0 0 6px">หน่วยบริการที่ยังไม่ระบุเครือข่ายในเอกสาร</h4>${d.extra.map(u=>`<div class="u"><span>${u.n} <span class="note">${u.aff}</span></span><span>${badge(u)}<div class="note">${dt(u.a)}</div></span></div>`).join('')}</div>`:''}`}).join('')}`}};
let t0;function sk(){clearTimeout(t0);t0=setTimeout(()=>{const p=document.activeElement.selectionStart;render();const i=document.getElementById('q');if(i){i.focus();i.setSelectionRange(p,p)}},250)}
function render(){tabs.innerHTML=TABS.map(t=>`<button class="tab ${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('');scope.textContent=S.d=='all'?'ภาพรวมทั้งจังหวัด':'อำเภอ'+S.d;app.innerHTML=V[S.tab]()}
dsel.innerHTML='<option value="all">ทั้งจังหวัด (13 อำเภอ)</option>'+DATA.map(d=>`<option>${d.n}</option>`).join('');dsel.onchange=()=>{S.d=dsel.value;render()};
foot.innerHTML='<b>หมายเหตุข้อมูล:</b> (1) แหล่งข้อมูล: สรุปการขึ้นทะเบียน 12 ต.ค. 69 และรายชื่อผ่านการประเมิน ค.ป.ค.ม. ปี 68–70 (2) แพทย์ FM ที่ต้องการเพิ่มรายอำเภอรวม 38 ท่าน ไม่นับหน่วยบริการที่มีแพทย์ FM แล้วแต่ยังไม่ได้ขึ้นทะเบียน ประกอบกับตารางสรุปจังหวัดที่ระบุความต้องการรวม 42 ท่าน และแผนอบรม 37 ท่าน (3) จำนวนหน่วยบริการรายอำเภอรวม 165 แห่ง ตรงกับสรุปจังหวัด (4) อ.สังขละบุรี ตัด รพ.สต.บ้านหนองรี/ลำอีซู/หลังเขา (ซ้ำกับ อ.บ่อพลอย) ออกแล้ว คงเหลือ 5 เครือข่ายที่มีรายชื่อ จากเป้าหมาย 6 ทีม (5) รพ.สต.บ้านลิ่นถิ่นที่ปรากฏใน อ.ไทรโยค ตัดออกเพราะซ้ำกับ อ.ทองผาภูมิ (6) รพ.สต.บ้านอู่ล่อง เพิ่มในเครือข่ายที่ 1 อ.ทองผาภูมิ (ประชากร 1,797 คน) ตามที่ผู้ใช้แจ้ง (7) รพ.พหลฯ, รพ.สมเด็จพระปิยฯ, รพ.ศุกร์ศิริฯ ไม่อยู่ในรายชื่อประเมิน';
render();
</script></body></html>
